id = "combo-unidentified-plus-data"
description = "One member stripped of all four labels, garbage in the written space of another"
classes = ["labels", "data"]

[[damage]]
member = { leaf = 0 }
range = "label:all"
pattern = "zeros"
[[damage]]
member = { leaf = 1 }
range = "data:40%..55%"
pattern = "random"

[expect]
# On a dRAID the parity budget is per redundancy group, and a group is
# only ndata+nparity columns wide out of all the children: two or three
# impaired members rarely land in the same group, so most rows keep a
# rebuildable column and only the few that collide are refused.
# This said "one member is effectively absent and a second one lies", and
# the first half of that was wrong. A member with no labels is not
# absent: every byte of its data is still there, and placing such a
# member by reading through it is the whole of F-62. So the mirror keeps
# both copies — one of them found the hard way — and covers the garbage
# on the other member. Refusing here would mean throwing away data that
# is sitting on the disk.
outcome = "recovered"
by_group_kind = { draid1 = ["recovered", "refused"], draid2 = ["recovered", "refused"] }
volumes = "all"
