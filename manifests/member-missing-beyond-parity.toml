id = "member-missing-beyond-parity"
description = "Three raidz2 members absent: beyond parity, must refuse cleanly"
classes = ["member"]


[[damage]]
member = "raidz2-0"
pattern = "missing"

[[damage]]
member = "raidz2-1"
pattern = "missing"

[[damage]]
member = "raidz2-2"
pattern = "missing"

[expect]
# Beyond parity: every block that lived only on this top-level vdev must be
# refused with a reason, and nothing may be presented as good. Datasets whose
# metadata has copies elsewhere stay listable — that is not a failure.
outcome = "refused"
volumes = "all"
