id = "metadata-mos-one-copy"
description = "One copy of the MOS objset block overwritten; the other copies are untouched"
classes = ["metadata"]

[[damage]]
target = { object = "mos:objset", copy = 0 }
pattern = "random"

[expect]
# The MOS is written with three copies. On a mirror the next copy is read
# directly; on a parity vdev the damaged column is rebuilt first.
outcome = "recovered"
volumes = "all"
