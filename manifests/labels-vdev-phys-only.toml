id = "labels-vdev-phys-only"
description = "Only the vdev_phys nvlists are zeroed in all four labels; every uberblock ring survives"
classes = ["labels"]

[[damage]]
member = { leaf = 0 }
range = "label:all/vdev_phys"
pattern = "zeros"

[expect]
# The member still carries a full uberblock history but no configuration,
# so the pool cannot place it. This is the case F-61 is meant to solve by
# confirming the member from an uberblock's own offset verifier.
outcome = "recovered"
volumes = "all"
