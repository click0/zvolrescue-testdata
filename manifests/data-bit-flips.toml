id = "data-bit-flips"
description = "Sixty-four single-bit flips scattered over the written space of one member"
classes = ["data"]

[[damage]]
member = { leaf = 0 }
range = "data:0%..100%"
pattern = "flip-bits:64"

[expect]
# Silent corruption of the kind a failing drive produces: every flipped
# block must be caught by its checksum. Whether it can then be rebuilt
# depends on where the flips landed; handing back a flipped block as good
# would be the failure.
outcome = ["recovered", "refused"]
volumes = "all"
