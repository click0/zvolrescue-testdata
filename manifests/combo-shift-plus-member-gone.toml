id = "combo-shift-plus-member-gone"
description = "One member shifted by 2048 sectors, another absent: two members unusable at once"
classes = ["partition", "member"]

[[damage]]
member = { leaf = 0 }
range = "0.."
pattern = "shift:2048"
[[damage]]
member = { leaf = 1 }
pattern = "missing"

[expect]
# Until the zero point could be recovered (SPEC F-61) this was two members
# lost at once, and a two-way mirror had nothing left. The shifted member's
# labels are intact — they simply verify at another base — so one uberblock
# checksum puts it back, and only the absent member is really gone.
outcome = "recovered"
volumes = "all"
