id = "labels-rings-forged-txg"
description = "Uberblock rings of one member replaced by the rings of an older image tag (valid but stale)"
classes = ["labels", "member"]


[[damage]]
member = "raidz2-0"
range = "128KiB..256KiB"
pattern = "older-self:image-v1-round6"

[[damage]]
member = "raidz2-0"
range = "384KiB..512KiB"
pattern = "older-self:image-v1-round6"

[expect]
# The newest verified TXG must come from the other members' rings, not the
# stale one: every volume still bit-exact at export.
outcome = "bit-exact"
volumes = "all"
evidence = ["txg"]
