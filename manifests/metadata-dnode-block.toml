id = "metadata-dnode-block"
description = "Every copy of the dnode block holding vm/disk-16k object 1 overwritten"
classes = ["metadata"]


[[damage]]
target = { object = "vm/disk-16k:dnode-block", copy = "all" }
pattern = "random"

[expect]
# No redundancy left for that block: the volume cannot be extracted at the
# newest TXG; an older TXG (before the last write) must still work.
outcome = "refused"
volumes = ["golden/vm/disk-16k"]
