id = "labels-all-four"
description = "All four labels of one member zeroed: the pool cannot identify it any more"
classes = ["labels"]

[[damage]]
member = { leaf = 0 }
range = "label:all"
pattern = "zeros"

[expect]
# An unidentified member counts as absent, so this costs one member's
# worth of redundancy, which every geometry in the image can spare.
# Recognising such a member by its surviving uberblocks is F-61.
outcome = "recovered"
volumes = "all"
