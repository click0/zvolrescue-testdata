id = "combo-across-tops-one-past-budget"
description = "One top-level vdev pushed one member past its parity budget while the others stay whole"
classes = ["member"]

[[damage]]
member = { leaf = 0, top = 2 }
pattern = "missing"
[[damage]]
member = { leaf = 1, top = 2 }
pattern = "missing"

[expect]
# This image's draid1 is four children in one redundancy group of ndata 2
# + nparity 1 with one distributed spare: a row uses three of the four,
# so two absent children is one past the parity of every row they are
# both in, and the blocks in those rows are gone. Every volume has
# blocks on this top (ZFS spreads a pool's writes over all of them), so
# every volume is refused or, with the lost blocks counted and
# announced, partial. The mirror and the raidz2 are untouched.
outcome = "refused"
volumes = "all"
