id = "partition-start-shifted"
description = "One member shifted forward by 2048 sectors, as if its partition had been re-created at another offset"
classes = ["partition"]

[[damage]]
member = { leaf = 0 }
range = "0.."
pattern = "shift:2048"

[expect]
# Every label and every block pointer of that member now sits 1 MiB away
# from where the pool expects it, so the member reads as unusable and
# redundancy carries the pool. Finding the shift is F-60/F-63.
outcome = "recovered"
volumes = "all"
