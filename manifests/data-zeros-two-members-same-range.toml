id = "data-zeros-two-members-same-range"
description = "The same bytes as `data-two-members-same-range`, zeroed instead of filled with garbage"
classes = ["data"]

# The controlled half of a pair. `data-two-members-same-range` overwrites
# these exact bytes with random ones; this one writes zeros, so the only
# thing that differs is what the damage looks like. Random bytes are
# obviously not a block. Zeros are what an unwritten region looks like,
# and a reader that takes an all-zero block for a hole would hand them
# back as data and call the volume whole. Only the checksum tells the two
# apart, and the two manifests together are what says so.
#
# Every byte ZFS wrote on both members, not a slice of them. The first
# version of this manifest damaged `span:5%..25%` — a percentage of the
# member's data area — and expected `refused` because both copies of a
# mirrored block were gone. That expectation held on the image it was
# written against and nowhere else: where a pool's blocks land is a
# property of the run that made it, not of the pool, so on a smaller
# image the same span missed the volume entirely and the extraction came
# back bit-exact. A manifest whose verdict depends on where ztest
# happened to allocate is a coin flip wearing a test's clothes. `data:`
# is resolved against the space each member actually has written, so
# 0%..100% is every block there is on both of them, on any image.
[[damage]]
member = { leaf = 0 }
range = "data:0%..100%"
pattern = "zeros"
[[damage]]
member = { leaf = 1 }
range = "data:0%..100%"
pattern = "zeros"

[expect]
# The same reasoning as the random version, for the same reason: the
# geometry decides what redundancy is left, not the byte pattern. If
# these two manifests ever disagree, the disagreement is the finding.
outcome = "refused"
by_group_kind = { raidz2 = "recovered", raidz3 = "recovered", draid1 = ["recovered", "refused"], draid2 = ["recovered", "refused"] }
volumes = "all"
