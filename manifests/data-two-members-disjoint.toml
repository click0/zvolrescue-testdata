id = "data-two-members-disjoint"
description = "Garbage in two members, in parts of the written space that do not overlap"
classes = ["data"]

[[damage]]
member = { leaf = 0 }
range = "data:10%..25%"
pattern = "random"
[[damage]]
member = { leaf = 1 }
range = "data:60%..75%"
pattern = "random"

[expect]
# No stripe and no mirrored block loses more than one copy.
outcome = "recovered"
volumes = "all"
