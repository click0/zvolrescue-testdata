id = "labels-one-l0"
description = "Label L0 of one member zeroed; the other three are untouched"
classes = ["labels"]

[[damage]]
member = { leaf = 0 }
range = "label:L0"
pattern = "zeros"

[expect]
# ZFS keeps four labels so that losing one costs nothing at all: the
# member stays identified and no redundancy is needed.
outcome = "bit-exact"
volumes = "all"
