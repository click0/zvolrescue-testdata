id = "partition-tail-truncated"
description = "Last 8 MiB of one member cut off: the rear labels are gone and the device is shorter than its asize"
classes = ["partition"]

[[damage]]
member = { leaf = 0 }
range = "-8MiB.."
pattern = "truncate"

[expect]
# The front labels remain, and the data ZFS put in the truncated tail (if
# any) is covered by redundancy.
outcome = "bit-exact"
volumes = "all"
