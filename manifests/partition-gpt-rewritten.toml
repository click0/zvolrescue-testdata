id = "partition-gpt-rewritten"
description = "First megabyte of one member overwritten, as a careless installer writing a partition table would"
classes = ["partition"]

[[damage]]
member = { leaf = 0 }
range = "0..1MiB"
pattern = "random"

[expect]
# L0 and L1 are gone but L2 and L3 are not, so nothing is lost.
outcome = "bit-exact"
volumes = "all"
