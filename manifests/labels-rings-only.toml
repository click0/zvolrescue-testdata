id = "labels-rings-only"
description = "Only the uberblock rings are zeroed in all four labels; the vdev_phys nvlists survive"
classes = ["labels"]

[[damage]]
member = { leaf = 0 }
range = "label:all/rings"
pattern = "zeros"

[expect]
# The member is still identified and readable; the newest TXG comes from
# the other members' rings.
outcome = "recovered"
volumes = "all"
